  <body>
    <a class="skip-link" href="#main" data-i18n="skip"></a>
    <header class="site-header">
      <a class="brand" href="#home" aria-label="Rattil home">
        <img src="assets/brand/rattil_mark_green.svg" alt="" width="42" height="42" />
        <span>rattil<span class="brand-period">.</span></span>

      <nav class="desktop-nav" aria-label="Primary navigation">
        <a href="#features" data-i18n="navFeatures"></a>

        <a href="#download" data-i18n="navDownload"></a>
      </nav>
      <div class="header-actions">

      </div>
    </header>

    <main id="main">
      <section class="hero section-wrap" id="home" aria-labelledby="hero-title">

          <div class="eyebrow"><span class="eyebrow-line"></span><span data-i18n="eyebrow"></span></div>
          <p class="arabic-title" lang="ar" dir="rtl">رَتِّلِ الْقُرْآنَ</p>
          <h1 id="hero-title" data-i18n="heroTitle"></h1>

          <div class="hero-actions">
            <a class="button button-primary" href="https://github.com/zarsalene/Quran_AI_app/releases/latest/download/Rattil.apk" data-download>
              <svg aria-hidden="true" viewBox="0 0 24 24" class="download-icon"><path d="M12 3v11m0 0 4-4m-4 4-4-4M5 17v3h14v-3"/></svg>
              <span data-i18n="downloadPrimary"></span>

            <a class="text-link" href="#features"><span data-i18n="explore"></span><span aria-hidden="true">↓</span></a>
          </div>
          <p class="download-meta"><span data-i18n="downloadMeta"></span><span class="meta-dot">·</span><span data-i18n="free"></span></p>
          <p class="trust-line"><span class="trust-check" aria-hidden="true">✓</span><span data-i18n="trustLine"></span></p>
        </div>
        <div class="hero-art" aria-label="Rattil app identity">
          <div class="art-orbit orbit-one"></div><div class="art-orbit orbit-two"></div>
          <div class="art-spark spark-one">✦</div><div class="art-spark spark-two">✧</div>
          <div class="art-card">
            <div class="art-brand"><img src="assets/brand/rattil_mark_green.svg" alt="" /><span>rattil<span class="brand-period">.</span></span></div>
            <div class="art-rule"><span></span><i>✦</i><span></span></div>

            <p class="art-caption" data-i18n="artCaption"></p>
            <div class="art-pillars"><span><b>01</b><small data-i18n="read"></small></span><span><b>02</b><small data-i18n="listen"></small></span><span><b>03</b><small data-i18n="memorize"></small></span></div>
          </div>
          <span class="art-note note-top" data-i18n="artNoteTop"></span><span class="art-note note-bottom" data-i18n="artNoteBottom"></span>
        </div>
        <a class="scroll-cue" href="#features" aria-label="Explore features"><span></span><span data-i18n="scroll"></span></a>
      </section>

      <section class="features-section section-pad" id="features" aria-labelledby="features-title">
        <div class="section-wrap">
          <div class="section-heading">
            <div><div class="eyebrow"><span class="eyebrow-line"></span><span data-i18n="featuresEyebrow"></span></div><h2 id="features-title" data-i18n="featuresTitle"></h2></div>
            <p data-i18n="featuresIntro"></p>
          </div>
          <div class="feature-grid" id="feature-grid"></div>
          <p class="teacher-note"><span class="note-mark" aria-hidden="true">i</span><span data-i18n="teacherDisclaimer"></span></p>
        </div>
      </section>

      <section class="values-section section-pad" id="values" aria-labelledby="values-title">
        <div class="values-pattern" aria-hidden="true"></div>
        <div class="section-wrap values-layout">
          <div class="values-copy">
            <div class="eyebrow eyebrow-light"><span class="eyebrow-line"></span><span data-i18n="valuesEyebrow"></span></div>
            <h2 id="values-title" data-i18n="valuesTitle"></h2>
            <p data-i18n="valuesIntro"></p>
            <div class="values-quote"><span class="quote-mark" aria-hidden="true">“</span><p data-i18n="valuesQuote"></p></div>
          </div>
          <ul class="values-list" id="values-list"></ul>
        </div>
      </section>

      <section class="download-section section-pad" id="download" aria-labelledby="download-title">
        <div class="section-wrap download-panel">
          <div class="download-decoration" aria-hidden="true"><span>۞</span><i></i></div>
          <div class="download-copy"><div class="eyebrow"><span class="eyebrow-line"></span><span data-i18n="downloadEyebrow"></span></div><h2 id="download-title" data-i18n="downloadTitle"></h2><p data-i18n="downloadBody"></p>
            <a class="button button-primary button-large" href="https://github.com/zarsalene/Quran_AI_app/releases/latest/download/Rattil.apk" data-download><svg aria-hidden="true" viewBox="0 0 24 24" class="download-icon"><path d="M12 3v11m0 0 4-4m-4 4-4-4M5 17v3h14v-3"/></svg><span data-i18n="downloadFinal"></span></a>
            <div class="download-tags"><span data-i18n="tagFree"></span><span data-i18n="tagAndroid"></span><span data-i18n="tagNoAccount"></span></div>
          </div>
          <aside class="install-card" aria-labelledby="install-title"><h3 id="install-title" data-i18n="installTitle"></h3><ol id="install-steps"></ol><p class="security-note" data-i18n="securityNote"></p></aside>
        </div>

    </main>

    <footer class="site-footer"><div class="section-wrap footer-inner">
      <div class="footer-brand"><a class="brand" href="#home"><img src="assets/brand/rattil_mark_white.svg" alt="" width="38" height="38" /><span>rattil<span class="brand-period">.</span></span></a><p data-i18n="footerTagline"></p></div>
      <div class="footer-links"><a href="https://github.com/zarsalene/Quran_AI_app/releases/latest/download/Rattil.apk" data-download data-i18n="footerDownload"></a><a href="https://github.com/zarsalene/Quran_AI_app" target="_blank" rel="noopener noreferrer" data-i18n="footerSource"></a><a href="privacy.html" data-i18n="footerPrivacy"></a></div>
      <p class="copyright">© <span id="year"></span> Rattil</p>
