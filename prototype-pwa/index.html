<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f6f0" />
    <meta name="description" content="A calm, private space to listen, practise, and build a Quran learning habit." />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='20' fill='%231e5344'/%3E%3Cpath d='M18 17h28v30H18z' fill='none' stroke='%23e9d9a8' stroke-width='2'/%3E%3Cpath d='M24 25h16M24 32h16M24 39h12' stroke='%23e9d9a8' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E" />
    <title>Iqra — a quieter way to learn</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <a class="brand" href="#home" aria-label="Iqra home"><span class="brand-mark">إ</span><span>iqra<span class="brand-dot">.</span></span></a>
        <div class="top-actions"><button class="icon-button" id="soundToggle" aria-label="Toggle sound">♪</button><button class="avatar" id="profileButton" aria-label="Profile">Z</button></div>
      </header>
      <main id="main" tabindex="-1"></main>
      <nav class="bottom-nav" aria-label="Main navigation">
        <button class="nav-item active" data-page="home"><span>⌂</span><small>Home</small></button>
        <button class="nav-item" data-page="read"><span>▤</span><small>Read</small></button>
        <button class="nav-item nav-practice" data-page="practice"><span class="mic-nav">●</span><small>Practise</small></button>
        <button class="nav-item" data-page="learn"><span>✦</span><small>Learn</small></button>
        <button class="nav-item" data-page="progress"><span>◷</span><small>Progress</small></button>
      </nav>
      <div id="toast" class="toast" role="status" aria-live="polite"></div>
      <div id="modalRoot"></div>
    </div>
    <script src="app.js" defer></script>
  </body>
</html>
