<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#faf8f1" />
  <meta name="description" content="Rattil privacy policy for the Android app and Rattil download website." />
  <link rel="icon" type="image/svg+xml" href="assets/brand/rattil_icon.svg" />
  <title>Privacy policy — Rattil</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    .policy-main{max-width:820px;padding-block:68px 100px}.policy-main h1{font:500 clamp(40px,6vw,58px)/1.1 var(--serif);margin:20px 0;color:var(--ink)}.policy-updated{color:#737c74;font-size:12px}.policy-main h2{margin:38px 0 10px;color:var(--emerald);font:600 20px var(--sans)}.policy-main p,.policy-main li{color:#53615b;font-size:14px;line-height:1.85}.policy-main ul{padding-inline-start:22px}.policy-main a{color:var(--emerald);text-decoration:underline;text-underline-offset:3px}.policy-back{display:inline-flex;margin-top:35px;color:var(--emerald);font-weight:700;font-size:13px}
  </style>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="index.html"><img src="assets/brand/rattil_mark_green.svg" alt="" width="42" height="42" /><span>rattil<span class="brand-period">.</span></span></a>
    <div class="header-actions"><label class="sr-only" for="language" data-p="language"></label><select id="language" class="language-select"><option value="en">English</option><option value="fr">Français</option><option value="ar">العربية</option></select><a class="header-download" href="https://github.com/zarsalene/Quran_AI_app/releases/latest/download/Rattil.apk" data-p="get"></a></div>
  </header>
  <main class="section-wrap policy-main">
    <div class="eyebrow"><span class="eyebrow-line"></span><span data-p="eyebrow"></span></div><h1 data-p="title"></h1><p class="policy-updated" data-p="updated"></p>
    <div id="policy-content"></div>
    <a class="policy-back" href="index.html" data-p="back"></a>
  </main>
  <footer class="site-footer"><div class="section-wrap footer-inner"><div class="footer-brand"><a class="brand" href="index.html"><img src="assets/brand/rattil_mark_white.svg" alt="" width="38" height="38" /><span>rattil<span class="brand-period">.</span></span></a><p data-p="tagline"></p></div><p class="copyright">© <span id="year"></span> Rattil</p></div></footer>
  <script src="privacy.js" defer></script>
</body>
</html>
