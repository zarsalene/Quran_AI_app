name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      - name: Fetch and verify models
        run: python3 tool/fetch_models.py

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      - run: flutter build apk --release --split-per-abi --target-platform android-arm,android-arm64

      - uses: actions/upload-artifact@v4
        with:
          name: rattil-apks
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
